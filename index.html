<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Calculatrice Web - TP6</title>
    <link rel="stylesheet" href="style.css">
    
</head>

<body>

<header>
    <h1>Mini-Application Web — Calculatrice</h1>
</header>

<main>

    <section class="card">
        <h2>Calculatrice</h2>

        <form id="calcForm">
            <label>Nombre A :</label>
            <input type="number" id="nombreA">

            <label>Nombre B :</label>
            <input type="number" id="nombreB">

            <label>Opération :</label>
            <select id="operation">
                <option value="+">Addition (+)</option>
                <option value="-">Soustraction (−)</option>
                <option value="*">Multiplication (×)</option>
                <option value="/">Division (÷)</option>
            </select>

            <button type="submit">Calculer</button>
        </form>

        <p id="erreur" class="erreur"></p>
        <p id="resultat" class="resultat"></p>
    </section>

    <section class="card">
        <h2>Historique des opérations</h2>
        <ul id="historique"></ul>
    </section>

</main>
<script src="app.js"></script>
<footer>
    <p>TP6 - Mini-App Web & PHP</p>
</footer>

</body>
</html>
